- title: Crackers
  description: >-
    A 2D split-screen multiplayer game built in a DigiPen in-house engine.
    The engine had no support for multiple viewports or cameras, so I extended it
    to render split-screen, and I built the game's full inventory system.
  team: Team of 5
  tags: [C++, 2D, Split-Screen Multiplayer, Custom Engine, Rendering, Gameplay Systems]
  video: /assets/video/Crackers_10sec_PARTNERS_IN_CRIME_NOT_REALLY.mp4

- title: The Last Act
  description: >-
    A 2D puzzle platformer where players use light and shadow to get past obstacles,
    built on our team's custom C++ engine. As tech lead, I planned and assigned the
    team's technical work and built the engine's architecture, its data pipeline
    for reading and writing game data, and its C++ scripting system.
  team: Team of 8 · Tech Lead
  tags: [C++, Custom Engine, Engine Architecture, Data Pipeline, Scripting, 2D Puzzle Platformer]
